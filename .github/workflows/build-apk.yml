# 云上构建 Android 平板应用 → APK
#
# 用途：在 GitHub Actions 的 ubuntu-latest runner 上构建 StepDraw 平板应用，
#       产出一个【未签名/调试签名】APK，下载后即可安装（平板为主）。
#
# 为什么不用 macOS runner：Android 构建在 Linux 上完全没问题（AGP 跨平台），
#   跑便宜的 ubuntu-latest（1 倍计费）即可，无需 macOS 10 倍计费。
#
# 触发：仅手动（在仓库 Actions 页点 Run workflow → Build Android APK）。

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: true
        default: "Release"
        type: choice
        options: [Release, Debug]

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/build.gradle.kts', 'android/settings.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 恢复 Android SDK 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/platforms
          key: android-sdk-${{ runner.os }}-35
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 包
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          yes | latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 构建 APK
        working-directory: android
        run: |
          cfg="${{ inputs.configuration || 'Release' }}"
          task=$(printf '%s' "$cfg" | tr '[:upper:]' '[:lower:]')
          # wrapper jar 已入库，直接 ./gradlew（自动下载正确版本 Gradle）
          chmod +x gradlew
          ./gradlew ":app:assemble${task}" --no-daemon --stacktrace

      - name: 校验产物
        working-directory: android
        run: |
          cfg="${{ inputs.configuration || 'Release' }}"
          lower=$(printf '%s' "$cfg" | tr '[:upper:]' '[:lower:]')
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK（下载用）
        uses: actions/upload-artifact@v4
        with:
          name: StepDraw_apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
