# 云上构建 iPad 应用 → 未签名 IPA（ipeddle 版）
#
# 用途：在 GitHub Actions 的 Ubuntu runner 上用 ipeddle（Swift for Linux + iOS SDK
#       交叉编译）构建 StepDraw，产出一个【未签名】IPA，
#       下载后本地用 Sideloadly / AltStore 自签（免费 Apple ID）安装。
#
# 为什么用 ipeddle 而不是 xcodebuild：
#   之前走 macos-15 runner + xcodebuild，但 macOS runner 是 10 倍计费。
#   ipeddle 在 Linux 上就能交叉编译 iOS，跑在便宜的 ubuntu-latest（1 倍计费），
#   首次 setup 约 5-10 分钟（下载 Swift 工具链 + iOS SDK），之后命中缓存很快。
#
# 为什么是"未签名"：CI 上没有你的签名私钥/描述文件。把私钥塞进 Secrets 既不安全
#       又需要付费开发者账号。未签名 IPA + 本地重签是免费、最安全的主流做法。
#
# 前提：ipad/ 下是一份纯 SwiftPM 包（Package.swift + ipeddle.toml），
#       与 Xcode 工程共用同一份源码（ipad/StepDraw/）。
#
# 触发：默认手动（Actions 页点 Run workflow）；push 到 main 且只改了 ipad/** 时自动构建。

name: Build iPad IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: true
        default: "Release"
        type: choice
        options: [Release, Debug]
  push:
    branches: [main]
    paths:
      - "ipad/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

env:
  IPAPPEDLE_DIR: ipad
  IPEDDLE_HOME: ${{ github.workspace }}/.ipeddle-home
  # 虚拟环境 + 里面的 ipeddle 命令（每步直接调 .venv/bin/ipeddle）
  VENV: ${{ github.workspace }}/.venv
  # workflow 输入是 Release/Debug；ipeddle 的 -c 要小写，build 步骤里用 tr 转
  BUILD_CFG: ${{ inputs.configuration || 'Release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 恢复 ipeddle 工具链缓存
        # 放在 setup 之前：命中缓存时 setup 是幂等的，会跳过下载（~4GB / 5-10 分钟）。
        # key 用静态值（工具链与本项目代码无关），最大化命中；ipeddle 自身升级时
        # setup 检测到版本不一致会自动更新。
        uses: actions/cache@v4
        with:
          path: ${{ env.IPEDDLE_HOME }}
          key: ipeddle-toolchain-${{ runner.os }}-1
          restore-keys: |
            ipeddle-toolchain-${{ runner.os }}-

      - name: 安装 Python 依赖（venv）
        run: |
          # ubuntu-24.04 的系统 Python 是 externally-managed（PEP 668），
          # 直接 pip install 会被拒，所以走虚拟环境
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --upgrade pip
          # [icons] 带上 Pillow，能把 1024 图标缩放到各尺寸（没有也能跑，只是直接复制）
          "$VENV/bin/pip" install "ipeddle[icons]"
          "$VENV/bin/ipeddle" --version

      - name: 安装 Swift for Linux + iOS 链接器 + iOS SDK
        run: |
          # 无缓存时首次约 5-10 分钟（下载约 4GB）；命中缓存则很快。
          # IPEDDLE_HOME 指向 workspace 下目录，供上面的 cache 动作复用
          "$VENV/bin/ipeddle" setup

      - name: 显示环境自检
        run: |
          "$VENV/bin/ipeddle" doctor || true

      - name: 用 ipeddle 构建未签名 IPA
        run: |
          cfg=$(printf '%s' "$BUILD_CFG" | tr '[:upper:]' '[:lower:]')
          # -o 直接指定输出路径；--inspect 顺便校验产物（架构 / 最低 iOS / 符号完整性）
          "$VENV/bin/ipeddle" build "$IPAPPEDLE_DIR" -c "$cfg" -o ./StepDraw_unsigned.ipa --inspect

      - name: 校验产物
        run: |
          ls -lh StepDraw_unsigned.ipa
          # IPA 就是个 zip，解包看一眼结构 + Info.plist 关键字段
          mkdir -p _ipa_check && (cd _ipa_check && unzip -q ../StepDraw_unsigned.ipa)
          echo "=== IPA 结构 ==="
          find _ipa_check -maxdepth 2
          echo "=== Info.plist ==="
          cat _ipa_check/Payload/StepDraw.app/Info.plist || true
          rm -rf _ipa_check

      - name: 上传 IPA（下载用）
        uses: actions/upload-artifact@v4
        with:
          name: StepDraw_unsigned_ipa
          path: StepDraw_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
