# 云上构建 iPad 应用 → 未签名 IPA
#
# 用途：在 GitHub Actions 的 macOS runner 上编译 StepDraw，产出一个【未签名】IPA，
#       下载后本地用 Sideloadly / AltStore 自签（免费 Apple ID）安装。
#
# 为什么是"未签名"：CI 上没有你的签名私钥/描述文件。把私钥塞进 Secrets 既不安全
#       又需要付费开发者账号。未签名 IPA + 本地重签是免费、最安全的主流做法。
#
# 触发：默认手动（Actions 页点 Run workflow）；push 到 main 且只改了 ipad/** 时自动构建。

name: Build iPad IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: true
        default: "Release"
        type: choice
        options: [Release, Debug]
  push:
    branches: [main]
    paths:
      - "ipad/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

env:
  XCODE_PROJ: ipad/StepDraw.xcodeproj
  XCODE_SCHEME: StepDraw

jobs:
  build:
    # macos-15 自带 Xcode 16.x，满足 iOS 17 部署目标。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -A5 'iOS SDKs'

      - name: 清理派生数据
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/StepDraw-* || true

      - name: Archive（关闭代码签名 → 未签名 app）
        run: |
          xcodebuild archive \
            -project $XCODE_PROJ \
            -scheme $XCODE_SCHEME \
            -configuration ${{ inputs.configuration || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/StepDraw \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            || {
              echo "::error::xcodebuild archive 失败，见上方日志"
              exit 1
            }

      - name: 检查产物
        run: |
          APP=./build/StepDraw.xcarchive/Products/Applications/StepDraw.app
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 StepDraw.app，xcarchive 内容如下："
            find ./build/StepDraw.xcarchive -maxdepth 3 -type d
            exit 1
          fi
          echo "找到 app：$(du -sh "$APP" | cut -f1)"
          # 打印 Info.plist 关键字段，便于核对
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true

      - name: 手动打包成未签名 IPA
        run: |
          # IPA 结构：Payload/StepDraw.app/...
          mkdir -p build/Payload
          cp -R ./build/StepDraw.xcarchive/Products/Applications/StepDraw.app build/Payload/
          cd build
          zip -qry ../StepDraw_unsigned.ipa Payload
          cd ..
          ls -lh StepDraw_unsigned.ipa
          echo "已生成 StepDraw_unsigned.ipa（未签名）"

      - name: 上传 IPA（下载用）
        uses: actions/upload-artifact@v4
        with:
          name: StepDraw_unsigned_ipa
          path: StepDraw_unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 同时保留 xcarchive，万一之后想直接签名/分发可复用
      - name: 上传 xcarchive（可选）
        uses: actions/upload-artifact@v4
        with:
          name: StepDraw_xcarchive
          path: ./build/StepDraw.xcarchive
          if-no-files-found: warn
          retention-days: 7
